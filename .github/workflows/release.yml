name: Release
run-name: Release backend, frontend and AgentHost (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  check_frontend_settings:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Check Static Web Apps settings
        shell: pwsh
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SWA_TOKEN)) {
            throw 'Set AZURE_STATIC_WEB_APPS_API_TOKEN for the target Static Web App in this GitHub environment.'
          }
          $origin = [uri]$env:FRONTEND_ORIGIN
          if (-not $origin.IsAbsoluteUri -or $origin.Scheme -ne 'https' -or $origin.AbsolutePath -ne '/' -or $origin.Query -or $origin.Fragment) {
            throw 'Set FRONTEND_ORIGIN to the Static Web App HTTPS origin, without a path, query or fragment.'
          }

  backend_and_agent:
    needs: check_frontend_settings
    outputs:
      api_url: ${{ steps.summary.outputs.api_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_RESOURCE_GROUP_LOCATION: ${{ vars.AZURE_RESOURCE_GROUP_LOCATION }}
      SQL_ENTRA_ADMIN_OBJECT_ID: ${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}
      SQL_ENTRA_ADMINISTRATOR_PRINCIPAL_TYPE: ${{ vars.SQL_ENTRA_ADMINISTRATOR_PRINCIPAL_TYPE || 'Application' }}
      SHAREPOINT_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SHAREPOINT_CLIENT_ID: ${{ vars.SHAREPOINT_CLIENT_ID }}
      SHAREPOINT_SITE_HOSTNAME: ${{ vars.SHAREPOINT_SITE_HOSTNAME }}
      SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH }}
      SHAREPOINT_DOCUMENT_LIBRARY_NAME: ${{ vars.SHAREPOINT_DOCUMENT_LIBRARY_NAME }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment settings
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SQL_ENTRA_ADMIN_OBJECT_ID)) {
            throw 'Set SQL_ENTRA_ADMIN_OBJECT_ID in the selected GitHub environment.'
          }
          [void][guid]::Parse($env:SQL_ENTRA_ADMIN_OBJECT_ID)
          if ($env:SQL_ENTRA_ADMINISTRATOR_PRINCIPAL_TYPE -cnotin @('Application', 'Group', 'User')) {
            throw 'SQL_ENTRA_ADMINISTRATOR_PRINCIPAL_TYPE must be Application, Group or User.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_RESOURCE_GROUP_LOCATION)) {
            throw 'Set AZURE_RESOURCE_GROUP_LOCATION in the selected GitHub environment.'
          }
          $parametersFile = "infra/parameters.$env:DEPLOY_ENVIRONMENT.json"
          $settings = (Get-Content $parametersFile -Raw | ConvertFrom-Json).parameters
          if ($settings.environmentName.value -ne $env:DEPLOY_ENVIRONMENT) {
            throw 'Parameter environment does not match the selected environment.'
          }
          if ([string]::IsNullOrWhiteSpace($settings.location.value)) {
            throw 'Set location in the environment parameter file.'
          }
          $resourceGroup = $env:AZURE_RESOURCE_GROUP
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
            $resourceGroup = "rg-$($settings.workloadName.value)-$env:DEPLOY_ENVIRONMENT"
          }
          "RESOURCE_GROUP=$resourceGroup" >> $env:GITHUB_ENV
          "PARAMETERS_FILE=$parametersFile" >> $env:GITHUB_ENV
      - name: Check application settings
        env:
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_CLIENT_STATE: ${{ secrets.SHAREPOINT_CLIENT_STATE }}
          MARKITDOWN_API_KEY: ${{ secrets.MARKITDOWN_API_KEY }}
        run: |
          if ($env:DEPLOY_ENVIRONMENT -eq 'local') {
            throw 'Use dev or test for a release.'
          }
          foreach ($name in @('SHAREPOINT_TENANT_ID', 'SHAREPOINT_CLIENT_ID', 'SHAREPOINT_CLIENT_SECRET', 'SHAREPOINT_SITE_HOSTNAME', 'SHAREPOINT_SITE_PATH', 'SHAREPOINT_DOCUMENT_LIBRARY_NAME', 'FRONTEND_ORIGIN', 'BOOTSTRAP_ADMIN_EMAIL')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Set $name in the selected GitHub environment."
            }
          }
          if ($env:SHAREPOINT_CLIENT_STATE.Length -lt 16 -or $env:MARKITDOWN_API_KEY.Length -lt 32) {
            throw 'SHAREPOINT_CLIENT_STATE requires 16+ characters; MARKITDOWN_API_KEY requires 32+ characters.'
          }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install SQL deployment tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global dotnet-ef --version 10.0.12
          Install-Module SqlServer -MinimumVersion 22.0.0 -Scope CurrentUser -Force -AllowClobber
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Compile templates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          az bicep build --file infra/main.bicep --outfile "$env:RUNNER_TEMP/main.json"
      - name: Read provisioned infrastructure
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $result = az deployment group show --resource-group $env:RESOURCE_GROUP `
            --name "infra-$env:DEPLOY_ENVIRONMENT" --query properties.outputs --output json
          if (-not $result) {
            throw 'Run Deploy infrastructure before releasing applications.'
          }
          $result | Set-Content "$env:RUNNER_TEMP/shared-outputs.json"
      - name: Prepare application deployment helpers
        run: |
          @'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $outputs = Get-Content "$env:RUNNER_TEMP/shared-outputs.json" -Raw | ConvertFrom-Json
          $hosting = $outputs.hosting.value
          $settings = (Get-Content $env:PARAMETERS_FILE -Raw | ConvertFrom-Json).parameters
          function Write-Parameters($Name, $Values) {
            $parameters = @{}
            foreach ($key in $Values.Keys) {
              $parameters[$key] = @{ value = $Values[$key] }
            }
            $path = "$env:RUNNER_TEMP/$Name.parameters.json"
            @{ parameters = $parameters } | ConvertTo-Json -Depth 30 | Set-Content $path
            chmod 600 $path
            return $path
          }
          function Invoke-Database($Query, $InputFile) {
            Import-Module SqlServer
            $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
            $arguments = @{
              ServerInstance = $hosting.sqlServerFqdn
              Database = $hosting.sqlDatabaseName
              AccessToken = $token
              Encrypt = 'Mandatory'
              AbortOnError = $true
              ConnectionTimeout = 30
              QueryTimeout = 300
              ErrorAction = 'Stop'
            }
            if ($InputFile) {
              $arguments.InputFile = $InputFile
            } else {
              $arguments.Query = $Query
            }
            Invoke-Sqlcmd @arguments | Out-Null
          }
          function Grant-Database($Name, $PrincipalId) {
            $sid = '0x' + [Convert]::ToHexString(([guid]$PrincipalId).ToByteArray())
            Invoke-Database -Query @"
          IF DATABASE_PRINCIPAL_ID(N'$Name') IS NULL
            CREATE USER [$Name] WITH SID = $sid, TYPE = E;
          IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'$Name' AND sid = $sid)
            THROW 50000, 'Runtime database principal does not match its managed identity.', 1;
          IF IS_ROLEMEMBER('db_datareader', '$Name') = 0
            ALTER ROLE db_datareader ADD MEMBER [$Name];
          IF IS_ROLEMEMBER('db_datawriter', '$Name') = 0
            ALTER ROLE db_datawriter ADD MEMBER [$Name];
          "@
          }
          function Grant-Role($PrincipalId, $Role, $Scope) {
            az role assignment create --assignee-object-id $PrincipalId --assignee-principal-type ServicePrincipal --role $Role --scope $Scope --output none
          }
          function Invoke-Foundry($Method, $Path, $Body, $ContentType = 'application/json') {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $token = az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv
              $arguments = @{
                Method = $Method
                Uri = "$($hosting.foundryProjectEndpoint)/$($Path)?api-version=v1"
                Headers = @{ Authorization = "Bearer $token" }
                ContentType = $ContentType
                TimeoutSec = 120
              }
              if ($null -ne $Body) {
                $arguments.Body = $Body | ConvertTo-Json -Depth 30 -Compress
              }
              try {
                return Invoke-RestMethod @arguments
              } catch {
                $status = [int]$_.Exception.Response.StatusCode
                if ($status -notin @(401, 403) -or $attempt -eq 29) {
                  throw
                }
                Start-Sleep -Seconds 10
              }
            }
          }
          '@ | Set-Content "$env:RUNNER_TEMP/deployment-helpers.ps1"
      - name: Build and push images
        run: |
          . "$env:RUNNER_TEMP/deployment-helpers.ps1"
          foreach ($component in @('Api', 'Background', 'AgentHost')) {
            $repository = $component.ToLowerInvariant()
            az acr build --registry $outputs.containerRegistryName.value --platform linux/amd64 --no-logs `
              --image "$repository`:$env:IMAGE_TAG" --file "backend/SharePointAgent.$component/Dockerfile" .
          }
          az acr build --registry $outputs.containerRegistryName.value --platform linux/amd64 --no-logs `
            --image "markitdown:$env:IMAGE_TAG" --file Dockerfile backend/MarkItDown
      - name: Apply SQL migrations and runtime grants
        run: |
          . "$env:RUNNER_TEMP/deployment-helpers.ps1"
          $rule = "github-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "SQL_FIREWALL_RULE=$rule" >> $env:GITHUB_ENV
          "SQL_SERVER_NAME=$($hosting.sqlServerName)" >> $env:GITHUB_ENV
          $ip = (Invoke-RestMethod 'https://api.ipify.org').Trim()
          if ([System.Net.IPAddress]::Parse($ip).AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) {
            throw 'Expected an IPv4 address for the runner.'
          }
          az sql server firewall-rule create --resource-group $env:RESOURCE_GROUP --server $hosting.sqlServerName `
            --name $rule --start-ip-address $ip --end-ip-address $ip --output none
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              Invoke-Database -Query 'SELECT 1'
              break
            } catch {
              if ($attempt -eq 29) {
                throw
              }
              Start-Sleep -Seconds 10
            }
          }
          dotnet ef migrations script --idempotent --project backend/SharePointAgent.Persistence --output "$env:RUNNER_TEMP/migrations.sql"
          Invoke-Database -InputFile "$env:RUNNER_TEMP/migrations.sql"
          Grant-Database 'sharepoint_api' $hosting.apiPrincipalId
          Grant-Database 'sharepoint_background' $hosting.workerPrincipalId
      - name: Deploy Foundry secrets and Container Apps
        env:
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_CLIENT_STATE: ${{ secrets.SHAREPOINT_CLIENT_STATE }}
          MARKITDOWN_API_KEY: ${{ secrets.MARKITDOWN_API_KEY }}
        run: |
          . "$env:RUNNER_TEMP/deployment-helpers.ps1"
          # Resolve the deployment identity independently of the configured SQL administrator.
          $token = az account get-access-token --query accessToken -o tsv
          $payload = $token.Split('.')[1].Replace('-', '+').Replace('_', '/')
          $payload = $payload.PadRight($payload.Length + (4 - $payload.Length % 4) % 4, '=')
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
          $deploymentPrincipalId = ([guid]$claims.oid).ToString()
          Grant-Role $deploymentPrincipalId 'eadc314b-1a2d-4efa-be10-5d325db5065e' $hosting.foundryProjectId
          Grant-Role $hosting.apiPrincipalId '53ca6127-db72-4b80-b1b0-d745d6d5456d' $hosting.foundryProjectId
          $registry = $outputs.containerRegistryLoginServer.value
          $values = @{
            deployApplicationImages = $true
            sqlEntraAdminObjectId = $env:SQL_ENTRA_ADMIN_OBJECT_ID
            sqlEntraAdministratorPrincipalType = $env:SQL_ENTRA_ADMINISTRATOR_PRINCIPAL_TYPE
            workloadName = $settings.workloadName.value
            environmentName = $env:DEPLOY_ENVIRONMENT
            location = $settings.location.value
            deployDocumentIntelligence = [bool]$settings.deployDocumentIntelligence.value
            deployContentSafety = [bool]$settings.deployContentSafety.value
            apiImage = "$registry/api:$env:IMAGE_TAG"
            backgroundImage = "$registry/background:$env:IMAGE_TAG"
            markItDownImage = "$registry/markitdown:$env:IMAGE_TAG"
            sharePointTenantId = $env:SHAREPOINT_TENANT_ID
            sharePointClientId = $env:SHAREPOINT_CLIENT_ID
            sharePointClientSecret = $env:SHAREPOINT_CLIENT_SECRET
            sharePointClientState = $env:SHAREPOINT_CLIENT_STATE
            sharePointSiteHostname = $env:SHAREPOINT_SITE_HOSTNAME
            sharePointSitePath = $env:SHAREPOINT_SITE_PATH
            sharePointDocumentLibraryName = $env:SHAREPOINT_DOCUMENT_LIBRARY_NAME
            frontendOrigin = $env:FRONTEND_ORIGIN
            bootstrapAdminEmail = $env:BOOTSTRAP_ADMIN_EMAIL
            markItDownApiKey = $env:MARKITDOWN_API_KEY
            embeddingDeploymentName = $outputs.embeddingDeploymentName.value
            chatDeploymentName = $outputs.chatDeploymentName.value
            serviceBusTopicName = $outputs.serviceBusTopicName.value
            serviceBusSubscriptionName = $outputs.serviceBusSubscriptionName.value
          }
          $parameterFile = Write-Parameters 'applications' $values
          $result = az deployment group create --resource-group $env:RESOURCE_GROUP --name "apps-$env:GITHUB_RUN_ID" `
            --template-file "$env:RUNNER_TEMP/main.json" --parameters $env:PARAMETERS_FILE $parameterFile --query properties.outputs -o json
          $result | Set-Content "$env:RUNNER_TEMP/app-outputs.json"
      - name: Publish Foundry hosted agent
        run: |
          . "$env:RUNNER_TEMP/deployment-helpers.ps1"
          $apps = Get-Content "$env:RUNNER_TEMP/app-outputs.json" -Raw | ConvertFrom-Json
          function Connection-Secret($Key) {
            return '$' + '{{connections.agent-secrets.credentials.' + $Key + '}}'
          }
          $environment = @{
            SqlServer__ConnectionString = "Server=tcp:$($hosting.sqlServerFqdn),1433;Database=$($hosting.sqlDatabaseName);Authentication=Active Directory Managed Identity;Encrypt=True;TrustServerCertificate=False;"
            SqlServer__AutoMigrate = 'false'
            SharePoint__TenantId = $env:SHAREPOINT_TENANT_ID
            SharePoint__ClientId = $env:SHAREPOINT_CLIENT_ID
            SharePoint__ClientSecret = (Connection-Secret 'graphClientSecret')
            SharePoint__ClientState = (Connection-Secret 'webhookClientState')
            SharePoint__SiteHostname = $env:SHAREPOINT_SITE_HOSTNAME
            SharePoint__SitePath = $env:SHAREPOINT_SITE_PATH
            SharePoint__DocumentLibraryName = $env:SHAREPOINT_DOCUMENT_LIBRARY_NAME
            SharePoint__SubscriptionRenewalEnabled = 'false'
            AzureOpenAI__UsedManagedIdentity = 'true'
            AzureOpenAI__Endpoint = $outputs.openAiEndpoint.value
            AzureOpenAI__EmbeddingDeployment = $outputs.embeddingDeploymentName.value
            AzureOpenAI__ChatDeployment = $outputs.chatDeploymentName.value
            AzureSearch__UsedManagedIdentity = 'true'
            AzureSearch__Endpoint = $outputs.searchEndpoint.value
            Uploads__UsedManagedIdentity = 'true'
            Uploads__ServiceUri = $outputs.uploadStorageServiceUri.value
            Uploads__ContainerName = $outputs.uploadContainerName.value
            MarkItDown__Endpoint = $apps.markItDownEndpoint.value
            MarkItDown__ApiKey = (Connection-Secret 'markItDownApiKey')
            OfficeCli__Enabled = 'false'
            ContentSafety__Enabled = ([bool]$settings.deployContentSafety.value).ToString().ToLowerInvariant()
            ContentSafety__UseManagedIdentity = 'true'
            ContentSafety__Endpoint = $outputs.contentSafetyEndpoint.value
          }
          $definition = @{
            kind = 'hosted'
            cpu = '1'
            memory = '2Gi'
            container_configuration = @{ image = "$($outputs.containerRegistryLoginServer.value)/agenthost:$env:IMAGE_TAG" }
            protocol_versions = @(@{ protocol = 'invocations'; version = '2.0.0' })
            environment_variables = $environment
          }
          $agent = $null
          try {
            $agent = Invoke-Foundry 'GET' 'agents/sharepoint-agent'
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) {
              throw
            }
          }
          if ($null -eq $agent) {
            $null = Invoke-Foundry 'POST' 'agents' @{ name = 'sharepoint-agent'; definition = $definition }
            $version = '1'
          } else {
            $created = Invoke-Foundry 'POST' 'agents/sharepoint-agent/versions' @{ definition = $definition }
            $version = [string]$created.version
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Foundry did not return a version.'
          }
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $agent = Invoke-Foundry 'GET' 'agents/sharepoint-agent'
            $principalId = $agent.instance_identity.principal_id
            if ($principalId) {
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $principalId) {
            throw 'Foundry execution identity was not provisioned.'
          }
          Grant-Database 'sharepoint_agenthost' $principalId
          Grant-Role $principalId '5e0bd9bd-7b93-4f28-af87-19fc36ad61bd' $outputs.openAiResourceId.value
          Grant-Role $principalId '8ebe5a00-799e-43f5-93ac-243d3dce84a7' $outputs.searchResourceId.value
          Grant-Role $principalId '7ca78c08-252a-4471-8644-bb5ff32d4ba0' $outputs.searchResourceId.value
          Grant-Role $principalId 'ba92f5b4-2d11-453d-a403-e96b0029c9fe' $outputs.storageResourceId.value
          if ($outputs.contentSafetyResourceId.value) {
            Grant-Role $principalId 'a97b65f3-24c7-4388-baec-2e87135dc908' $outputs.contentSafetyResourceId.value
          }
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            $state = Invoke-Foundry 'GET' "agents/sharepoint-agent/versions/$version"
            if ($state.status -eq 'active') {
              break
            }
            if ($state.status -in @('failed', 'deleted', 'deleting')) {
              throw "Foundry version $version entered state $($state.status)."
            }
            Start-Sleep -Seconds 10
          }
          if ($state.status -ne 'active') {
            throw 'Timed out waiting for the Foundry version.'
          }
          $null = Invoke-Foundry 'PATCH' 'agents/sharepoint-agent' @{
            agent_endpoint = @{
              version_selector = @{
                version_selection_rules = @(@{ type = 'FixedRatio'; agent_version = $version; traffic_percentage = 100 })
              }
              protocol_configuration = @{ invocations = @{} }
            }
          } 'application/merge-patch+json'
          "FOUNDRY_VERSION=$version" >> $env:GITHUB_ENV
      - name: Check application health
        run: |
          $apps = Get-Content "$env:RUNNER_TEMP/app-outputs.json" -Raw | ConvertFrom-Json
          foreach ($endpoint in @($apps.apiUrl.value, $apps.markItDownEndpoint.value)) {
            Invoke-RestMethod "$($endpoint.TrimEnd('/'))/health" -MaximumRetryCount 12 -RetryIntervalSec 10 -TimeoutSec 30 | Out-Null
          }
      - name: Deployment summary
        id: summary
        run: |
          "## Deployment completed" >> $env:GITHUB_STEP_SUMMARY
          "- Environment: $env:DEPLOY_ENVIRONMENT" >> $env:GITHUB_STEP_SUMMARY
          "- Resource group: $env:RESOURCE_GROUP" >> $env:GITHUB_STEP_SUMMARY
          if ($env:FOUNDRY_VERSION) {
            $apps = Get-Content "$env:RUNNER_TEMP/app-outputs.json" -Raw | ConvertFrom-Json
            "api_url=$($apps.apiUrl.value)" >> $env:GITHUB_OUTPUT
            "- API: $($apps.apiUrl.value)" >> $env:GITHUB_STEP_SUMMARY
            "- Foundry agent version: $env:FOUNDRY_VERSION" >> $env:GITHUB_STEP_SUMMARY
            "- Image tag: $env:IMAGE_TAG" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Remove runner SQL firewall rule
        if: always() && env.SQL_FIREWALL_RULE != ''
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          az sql server firewall-rule delete --resource-group $env:RESOURCE_GROUP --server $env:SQL_SERVER_NAME --name $env:SQL_FIREWALL_RULE --output none
      - name: Remove temporary deployment files
        if: always()
        run: |
          foreach ($name in @('applications.parameters.json', 'deployment-helpers.ps1', 'migrations.sql', 'shared-outputs.json', 'app-outputs.json', 'main.json')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force
            }
          }


  frontend:
    needs: backend_and_agent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        env:
          VITE_API_BASE_URL: ${{ needs.backend_and_agent.outputs.api_url }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:VITE_API_BASE_URL)) {
            throw 'Backend deployment did not return its API URL.'
          }
          npm ci
          npm run build
          foreach ($file in @('index.html', 'auth-redirect.html', 'staticwebapp.config.json')) {
            if (-not (Test-Path "dist/$file")) {
              throw "Missing frontend build output: $file"
            }
          }
      - name: Deploy Azure Static Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}
      - name: Release summary
        shell: pwsh
        env:
          FRONTEND_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          API_URL: ${{ needs.backend_and_agent.outputs.api_url }}
        run: |
          "## Release completed" >> $env:GITHUB_STEP_SUMMARY
          "- Frontend: $env:FRONTEND_URL" >> $env:GITHUB_STEP_SUMMARY
          "- API: $env:API_URL" >> $env:GITHUB_STEP_SUMMARY
          "- Backend, Background, MarkItDown and Foundry AgentHost deployed by this release workflow." >> $env:GITHUB_STEP_SUMMARY
