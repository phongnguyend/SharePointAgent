name: Release Frontend
run-name: Release Frontend (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test]
        default: dev
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or test)
        required: true
        type: string
      orchestrated:
        description: The calling release workflow holds the environment deployment lock
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Avoid waiting on the caller's environment lock during a combined release.
  group: ${{ inputs.orchestrated && format('release-frontend-{0}-{1}', github.run_id, github.run_attempt) || format('deployment-{0}', inputs.environment) }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Static Web Apps settings
        shell: pwsh
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SWA_TOKEN)) {
            throw 'Set AZURE_STATIC_WEB_APPS_API_TOKEN for the target Static Web App in this GitHub environment.'
          }
          $origin = [uri]$env:FRONTEND_ORIGIN
          if (-not $origin.IsAbsoluteUri -or $origin.Scheme -ne 'https' -or $origin.AbsolutePath -ne '/' -or $origin.Query -or $origin.Fragment) {
            throw 'Set FRONTEND_ORIGIN to the Static Web App HTTPS origin, without a path, query or fragment.'
          }
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read provisioned API URL
        id: infrastructure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $settings = (Get-Content "infra/parameters.$env:DEPLOY_ENVIRONMENT.json" -Raw | ConvertFrom-Json).parameters
          $resourceGroup = $env:AZURE_RESOURCE_GROUP
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
            $resourceGroup = "rg-$($settings.workloadName.value)-$env:DEPLOY_ENVIRONMENT"
          }
          . ./.github/scripts/deployment-outputs.ps1
          $apiUrl = Get-OptionalDeploymentOutput 'container-apps' 'apiUrl' $resourceGroup $env:DEPLOY_ENVIRONMENT
          $uri = [uri]$apiUrl
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or $uri.AbsolutePath -ne '/' -or $uri.Query -or $uri.Fragment) {
            throw 'Infrastructure did not return a valid HTTPS API origin. Run Deploy Container Apps infrastructure first.'
          }
          "api_url=$($uri.GetLeftPart([System.UriPartial]::Authority))" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        env:
          VITE_API_BASE_URL: ${{ steps.infrastructure.outputs.api_url }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:VITE_API_BASE_URL)) {
            throw 'Infrastructure did not return its API URL.'
          }
          npm ci
          npm run build
          foreach ($file in @('index.html', 'auth-redirect.html', 'staticwebapp.config.json')) {
            if (-not (Test-Path "dist/$file")) {
              throw "Missing frontend build output: $file"
            }
          }
      - name: Deploy Azure Static Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}
      - name: Release summary
        shell: pwsh
        env:
          FRONTEND_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          API_URL: ${{ steps.infrastructure.outputs.api_url }}
        run: |
          "## Release completed" >> $env:GITHUB_STEP_SUMMARY
          "- Frontend: $env:FRONTEND_URL" >> $env:GITHUB_STEP_SUMMARY
          "- API: $env:API_URL" >> $env:GITHUB_STEP_SUMMARY
