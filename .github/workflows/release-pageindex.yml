name: Release PageIndex
run-name: Release PageIndex (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test]
        default: dev
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or test)
        required: true
        type: string
      orchestrated:
        description: The calling release workflow holds the environment deployment lock
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Avoid waiting on the caller's environment lock during a combined release.
  group: ${{ inputs.orchestrated && format('release-pageindex-{0}-{1}', github.run_id, github.run_attempt) || format('deployment-{0}', inputs.environment) }}
  cancel-in-progress: false

jobs:
  pageindex:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PAGEINDEX_AZURE_API_VERSION: ${{ vars.PAGEINDEX_AZURE_API_VERSION || '2024-10-21' }}
      PAGEINDEX_INDEX_MODEL: ${{ vars.PAGEINDEX_INDEX_MODEL }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check PageIndex settings
        env:
          PAGEINDEX_SERVICE_API_KEY: ${{ secrets.PAGEINDEX_SERVICE_API_KEY }}
          PAGEINDEX_AZURE_API_KEY: ${{ secrets.PAGEINDEX_AZURE_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DEPLOY_ENVIRONMENT -notin @('dev', 'test')) {
            throw 'Select dev or test as the target environment.'
          }
          if ($env:PAGEINDEX_SERVICE_API_KEY.Length -lt 32) {
            throw 'PAGEINDEX_SERVICE_API_KEY requires 32+ characters.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PAGEINDEX_AZURE_API_KEY)) {
            throw 'Set PAGEINDEX_AZURE_API_KEY for Azure OpenAI summaries.'
          }
          $settings = (Get-Content "infra/parameters.$env:DEPLOY_ENVIRONMENT.json" -Raw | ConvertFrom-Json).parameters
          if ($settings.environmentName.value -ne $env:DEPLOY_ENVIRONMENT) {
            throw 'Parameter environment does not match the selected environment.'
          }
          $resourceGroup = $env:AZURE_RESOURCE_GROUP
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
            $resourceGroup = "rg-$($settings.workloadName.value)-$env:DEPLOY_ENVIRONMENT"
          }
          "RESOURCE_GROUP=$resourceGroup" >> $env:GITHUB_ENV
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and release PageIndex
        env:
          PAGEINDEX_SERVICE_API_KEY: ${{ secrets.PAGEINDEX_SERVICE_API_KEY }}
          PAGEINDEX_AZURE_API_KEY: ${{ secrets.PAGEINDEX_AZURE_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          . "$env:GITHUB_WORKSPACE/.github/scripts/container-apps.ps1"
          $outputs = az deployment group show --resource-group $env:RESOURCE_GROUP --name "infra-$env:DEPLOY_ENVIRONMENT" --query properties.outputs -o json | ConvertFrom-Json
          if (-not $outputs.pageIndexContainerAppName.value) {
            throw 'Run Deploy infrastructure before releasing PageIndex.'
          }
          Push-Location backend/PageIndex
          try {
            az acr build --registry $outputs.containerRegistryName.value --platform linux/amd64 --no-logs `
              --image "pageindex:$env:IMAGE_TAG" --file Dockerfile .
          } finally {
            Pop-Location
          }
          $model = $env:PAGEINDEX_INDEX_MODEL
          if ([string]::IsNullOrWhiteSpace($model)) {
            $model = "azure/$($outputs.chatDeploymentName.value)"
          }
          if (-not $model.StartsWith('azure/')) {
            throw 'PAGEINDEX_INDEX_MODEL must use azure/<deployment-name>.'
          }
          $environment = @(
            @{ name = 'PAGEINDEX_SERVICE_API_KEY'; secretRef = 'pageindex-api-key' }
            @{ name = 'AZURE_API_KEY'; secretRef = 'pageindex-azure-api-key' }
            @{ name = 'AZURE_API_BASE'; value = $outputs.openAiEndpoint.value }
            @{ name = 'AZURE_API_VERSION'; value = $env:PAGEINDEX_AZURE_API_VERSION }
            @{ name = 'PAGEINDEX_INDEX_MODEL'; value = $model }
            @{ name = 'PAGEINDEX_MAX_FILE_BYTES'; value = '26214400' }
            @{ name = 'PAGEINDEX_TIMEOUT_SECONDS'; value = '210' }
            @{ name = 'PAGEINDEX_MAX_CONCURRENCY'; value = '2' }
          )
          $secrets = @(
            @{ name = 'pageindex-api-key'; value = $env:PAGEINDEX_SERVICE_API_KEY }
            @{ name = 'pageindex-azure-api-key'; value = $env:PAGEINDEX_AZURE_API_KEY }
          )
          Update-ContainerApp $outputs.pageIndexContainerAppName.value 'pageindex' $environment $secrets 8000
          Wait-ContainerApp $outputs.pageIndexContainerAppName.value
          Invoke-RestMethod "$($outputs.pageIndexEndpoint.value.TrimEnd('/'))/health" -MaximumRetryCount 12 -RetryIntervalSec 10 -TimeoutSec 30 | Out-Null
          "## PageIndex deployed" >> $env:GITHUB_STEP_SUMMARY
          "- Image: $($outputs.containerRegistryLoginServer.value)/pageindex:$env:IMAGE_TAG" >> $env:GITHUB_STEP_SUMMARY
      - name: Remove temporary request file
        if: always()
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pageindex.request.json'
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Force
          }
