name: Release Database
run-name: Release Database (${{ inputs.environment }})
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - test
        default: dev
permissions:
  contents: read
  id-token: write
concurrency:
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  db_migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment settings
        run: |
          $parametersFile = "infra/parameters.$env:DEPLOY_ENVIRONMENT.json"
          $settings = (Get-Content $parametersFile -Raw | ConvertFrom-Json).parameters
          if ($settings.environmentName.value -ne $env:DEPLOY_ENVIRONMENT) {
            throw 'Parameter environment does not match the selected environment.'
          }
          if ([string]::IsNullOrWhiteSpace($settings.location.value)) {
            throw 'Set location in the environment parameter file.'
          }
          $resourceGroup = $env:AZURE_RESOURCE_GROUP
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
            $resourceGroup = "rg-$($settings.workloadName.value)-$env:DEPLOY_ENVIRONMENT"
          }
          "RESOURCE_GROUP=$resourceGroup" >> $env:GITHUB_ENV
          "PARAMETERS_FILE=$parametersFile" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install SQL deployment tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global dotnet-ef --version 10.0.12
          Install-Module SqlServer -MinimumVersion 22.0.0 -Scope CurrentUser -Force -AllowClobber
      - name: Generate SQL migration script
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore backend/SharePointAgent.Persistence/SharePointAgent.Persistence.csproj
          dotnet ef migrations script --idempotent --project backend/SharePointAgent.Persistence --output "$env:RUNNER_TEMP/migrations.sql"
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read provisioned infrastructure
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $result = az deployment group show --resource-group $env:RESOURCE_GROUP `
            --name "infra-$env:DEPLOY_ENVIRONMENT" --query properties.outputs --output json
          if (-not $result) {
            throw 'Run Deploy infrastructure before releasing applications.'
          }
          $result | Set-Content "$env:RUNNER_TEMP/shared-outputs.json"
      - name: Release Database
        run: |
          & ./.github/scripts/release-database.ps1
      - name: Deployment summary
        run: |
          "## Database release completed" >> $env:GITHUB_STEP_SUMMARY
          "- Environment: $env:DEPLOY_ENVIRONMENT" >> $env:GITHUB_STEP_SUMMARY
      - name: Remove runner SQL firewall rule
        if: always() && env.SQL_FIREWALL_RULE != ''
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          az sql server firewall-rule delete --resource-group $env:RESOURCE_GROUP --server $env:SQL_SERVER_NAME --name $env:SQL_FIREWALL_RULE --output none
      - name: Remove temporary deployment files
        if: always()
        run: |
          foreach ($name in @('foundry-secrets.request.json', 'api.request.json', 'background.request.json', 'migrations.sql', 'shared-outputs.json')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force
            }
          }
