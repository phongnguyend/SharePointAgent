name: Report Current Capacity
run-name: Current capacity (${{ inputs.environment }})
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test]
        default: dev
permissions:
  contents: read
  id-token: write
concurrency:
  # Read after any in-flight deployment finishes.
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Report current capacity
        run: |
          & ./.github/scripts/report-capacity.ps1 `
            -EnvironmentName $env:DEPLOY_ENVIRONMENT `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP
