name: Configure AgentHost Capacity
run-name: Capacity AgentHost (${{ inputs.environment }}, ${{ inputs.cpu }} vCPU)
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test]
        default: dev
      cpu:
        description: vCPU per session (0.5 = 1 GiB, 1 = 2 GiB, 2 = 4 GiB)
        required: true
        type: choice
        options: ['0.5', '1', '2']
        default: '2'
permissions:
  contents: read
  id-token: write
concurrency:
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      CAPACITY_CPU: ${{ inputs.cpu }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure capacity
        run: |
          & ./.github/scripts/configure-agent-capacity.ps1 `
            -EnvironmentName $env:DEPLOY_ENVIRONMENT `
            -Cpu $env:CAPACITY_CPU `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP
