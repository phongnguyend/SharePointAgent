name: Start or Stop - System One - Laya Native
run-name: ${{ inputs.action }} - System One - Laya Native (${{ inputs.environment }})
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - test
        default: dev
      action:
        description: LayaNative Container App action
        required: true
        type: choice
        options:
          - start
          - stop
        default: start
permissions:
  contents: read
  id-token: write
concurrency:
  # Serialize with infrastructure and application releases for this environment.
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  layanative:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      CONTAINER_ACTION: ${{ inputs.action }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Stopped, the app runs no replicas and uses no inference compute, and requests cannot wake it.
      - name: Start or stop LayaNative
        run: |
          & ./.github/scripts/manage-laya-native.ps1 `
            -EnvironmentName $env:DEPLOY_ENVIRONMENT `
            -Action $env:CONTAINER_ACTION `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP
